aid: lingvist
name: Lingvist
description: >-
  Lingvist is an Estonian education technology company building an AI-powered
  language-learning platform that uses machine learning, language statistics and
  spaced repetition to teach the vocabulary a learner actually needs. It was
  founded by Mait Müntel, a physicist who worked on the Higgs boson discovery
  team at CERN and built the first prototype to teach himself French. Lingvist
  maps each learner's knowledge in real time and adapts course material to them
  individually, offering 60+ courses across 15+ languages, a Custom Decks feature
  that turns a learner's own words or texts into a course, and a Lingvist for
  Business offering. Lingvist does not operate a public, self-serve API program -
  no developer portal, API reference or machine-readable specification is
  published. It does run an OAuth 2.0 protected API at api.lingvist.com whose
  endpoints are publicly documented only through Lingvist's own open-source
  NodeBB single-sign-on plugin, with client credentials arranged directly with
  Lingvist rather than self-registered.
